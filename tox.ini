[tox]
isolated_build = true
env_list = 
  test-py312-torch25-extra
labels =
  snapshots = test-py310-torch{20,21,22,23,24,25,26}-extra-snapshot
  test = test-py310-torch20-extra,\
    test-py311-torch21-extra,\
    test-py311-torch22-extra,\
    test-py311-torch23-extra,\
    test-py311-torch24-extra,\
    test-py312-torch25-extra,\
    test-py313-torch26-extra
  test-short = test-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}-extra
  test-long = test-long-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}-extra
  test-notebooks = test-notebooks-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}
  test-20 = test-py310-torch20-extra
  test-21 = test-py311-torch21-extra
  test-22 = test-py311-torch22-extra
  test-23 = test-py311-torch23-extra
  test-24 = test-py311-torch24-extra
  test-25 = test-py312-torch25-extra
  test-26 = test-py313-torch26-extra
  test-one = test-py312-torch25-extra
  test-long-one = test-long-py312-torch25-extra
  test-notebooks-one = test-notebooks-py312-torch25
  test-all = test{,-long}-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}{,-extra},\
    test-notebooks-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}
  debug-20 = debug-py310-torch20-extra
  debug-21 = debug-py311-torch21-extra
  debug-22 = debug-py311-torch22-extra
  debug-23 = debug-py311-torch23-extra
  debug-24 = debug-py312-torch24-extra
  debug-25 = debug-py312-torch25-extra
  debug-26 = debug-py313-torch26-extra
  debug-one = debug-py312-torch25-extra

[testenv]
skip_install = true
create_env = true
runner = gp-runner
allowlist_externals =
  python
  cp
pass_env =
  GP_*
no_default_groups = true
uv_sync_flags =
  extra: --all-extras
set_env =
  GP_TOX_FACTOR_TORCH = {[factor]torch}
  GP_TOX_FACTOR_EXTRA = {[factor]extra}
  GP_TOX_FACTOR_PY = {[factor]py}
  long: GP_LONG_TESTS = 1
# Skip combinations of environments known to be unsupported
noop =
  py311-torch20: true
  py312-torch{20,21,22,23}: true
  py313-torch{20,21,22,23,24,25}: true
  py38-torch{25,26}: true
noop_message =
  py311-torch20: Skipping {envname}, python 3.11 incompatible with compile() in torch < 2.1
  py312-torch{20,21,22,23}: Skipping {envname}, python 3.12 incompatible with compile() in torch < 2.4
  py313-torch{20,21,22,23,24,25}: Skipping {envname}, python 3.12 incompatible with compile() in torch < 2.6
  py38-torch{25,26}: Skipping {envname}, python 3.8 support dropped in torch >= 2.5

# Make factors' actual values available for string substitution
[factor]
torch =
  torch20: torch20
  torch21: torch21
  torch22: torch22
  torch23: torch23
  torch24: torch24
  torch25: torch25
  torch26: torch26
extra =
  extra: true
py =
  py38: py38
  py39: py39
  py310: py310
  py311: py311
  py312: py312
  py313: py313

[testenv:{debug,test}{,-long}-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}{,-extra}{,-coverage,-snapshot}]
dependency_groups =
  testenv-test
  qol
  {[factor]torch}
  coverage: testenv-test-coverage
  debug: testenv-test-debug
commands =
  test-!coverage-!snapshot: pytest -ra -n {env:GP_PYTEST_N:4} {posargs}
  debug: uv pip install transformers==4.47.0
  debug: pytest -ra -x -s --pdb {posargs}
  # TODO: if we add more snapshots, we should make selecting those tests more generic (pytest labels?)
  snapshot: pytest --snapshot-update tests/test_node_path.py {posargs}
  # TODO: we should merge together from multiple runs
  coverage: pytest --cov=graphpatch --cov-report=xml:coverage.xml {posargs}

[testenv:test-notebooks-py{38,39,310,311,312,313}-torch{20,21,22,23,24,25,26}]
dependency_groups =
  testenv-test-notebooks
  {[factor]torch}
commands =
  pytest --nbmake demos -ra {posargs}

[testenv:lint]
dependency_groups =
  testenv-lint
commands =
  flake8 graphpatch demos tests

[testenv:format]
dependency_groups =
  testenv-format
commands =
  isort graphpatch demos tests
  black --config .black graphpatch demos tests

[testenv:typecheck]
dependency_groups =
  testenv-typecheck
commands =
  mypy graphpatch demos

[testenv:docs-{full,readme}]
basepython = 3.12
dependency_groups =
  testenv-docs
commands =
  full,readme: python scripts/export_extras_versions.py docs/extras_versions.rst
  full: sphinx-autobuild -a docs docs/_build/html -E --watch graphpatch {posargs}
  readme: sphinx-build -M markdown docs docs/_build {posargs}
  readme: cp docs/_build/markdown/index.md README.md
